<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Request Management System</title>
    <!-- Supabase JS Client -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- Dashboard -->
    <div id="dashboardPage" class="page-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <h1><i class="fas fa-tasks"></i> Service Request Manager</h1>
            </div>
            <div class="header-right">
                <span id="userEmailDisplay" class="user-email"><i class="fas fa-user-circle"></i> user@example.com</span>
                <button id="logoutBtn" class="btn btn-outline"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>

        <!-- Metrics Cards -->
        <section class="metrics-grid">
            <div class="metric-card"><span class="metric-label">Total</span><span id="totalCount" class="metric-value">0</span></div>
            <div class="metric-card pending"><span class="metric-label">Pending</span><span id="pendingCount" class="metric-value">0</span></div>
            <div class="metric-card in-progress"><span class="metric-label">In Progress</span><span id="inProgressCount" class="metric-value">0</span></div>
            <div class="metric-card completed"><span class="metric-label">Completed</span><span id="completedCount" class="metric-value">0</span></div>
        </section>

        <!-- Toolbar -->
        <div class="toolbar">
            <button id="openNewRequestBtn" class="btn btn-success"><i class="fas fa-plus-circle"></i> New Request</button>
            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="🔍 Search requester / description...">
                <select id="statusFilter">
                    <option value="">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Completed">Completed</option>
                </select>
                <select id="priorityFilter">
                    <option value="">All Priority</option>
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
        </div>

        <!-- Requests Table -->
        <div class="table-wrapper">
            <table id="requestsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Requester</th>
                        <th>Department</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Date Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal: New / Edit Request -->
    <div id="requestModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span id="closeModalBtn" class="close-btn">&times;</span>
            <h2 id="modalTitle"><i class="fas fa-pen"></i> New Request</h2>
            <form id="requestForm">
                <input type="hidden" id="editRequestId" value="">
                <div class="form-row">
                    <div class="form-group">
                        <label>Requester Name *</label>
                        <input type="text" id="reqRequester" placeholder="Full name" required>
                    </div>
                    <div class="form-group">
                        <label>Department *</label>
                        <input type="text" id="reqDepartment" placeholder="e.g. IT" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category *</label>
                        <input type="text" id="reqCategory" placeholder="e.g. Hardware" required>
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <select id="reqPriority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="reqDescription" rows="2" placeholder="Describe the request..." required></textarea>
                </div>
                <div class="form-group" id="statusGroup" style="display:none;">
                    <label>Status</label>
                    <select id="reqStatus">
                        <option value="Pending">Pending</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary" id="saveRequestBtn">
                    <i class="fas fa-save"></i> Save
                </button>
            </form>
        </div>
    </div>

    <!-- Main JavaScript -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
