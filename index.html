<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Lab Asset Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="app" style="display:none;">
        <header class="app-header">
            <h1>📦 Laboratory Asset Management</h1>
            <div class="header-right">
                <span id="userInfo"></span>
                <span id="roleBadge" class="badge"></span>
                <button id="logoutBtn" class="btn btn-outline">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </header>

        <nav id="mainNav" class="main-nav"></nav>

        <main class="dashboard">
            <h2>Welcome, <span id="welcomeName"></span>!</h2>

            <section class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-label">Total Equipment</span>
                    <span id="totalEquipment" class="metric-value">0</span>
                </div>
                <div class="metric-card pending">
                    <span class="metric-label">Available</span>
                    <span id="availableEquipment" class="metric-value">0</span>
                </div>
                <div class="metric-card in-progress">
                    <span class="metric-label">Borrowed</span>
                    <span id="borrowedEquipment" class="metric-value">0</span>
                </div>
                <div class="metric-card completed">
                    <span class="metric-label">Pending Approvals</span>
                    <span id="pendingApprovals" class="metric-value">0</span>
                </div>
            </section>
        </main>
    </div>

    <div id="loading" class="loading-spinner"><h2>Loading...</h2></div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
