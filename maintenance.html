<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - Lab Asset Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="app" style="display:none;">
        <header class="app-header">
            <h1>🔧 Maintenance</h1>
            <div class="header-right">
                <span id="userInfo"></span>
                <span id="roleBadge" class="badge"></span>
                <button id="logoutBtn" class="btn btn-outline">Logout</button>
            </div>
        </header>
        <nav id="mainNav" class="main-nav"></nav>

        <main class="dashboard">
            <div class="page-header">
                <h1>🔧 Maintenance Records</h1>
                <button id="addMaintBtn" class="btn btn-success">➕ New Record</button>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Equipment</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody id="maintBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="loading" class="loading-spinner"><h2>Loading...</h2></div>

    <div id="maintModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn" id="closeMaintModal">&times;</span>
            <h2>New Maintenance Record</h2>
            <form id="maintForm">
                <div class="form-group">
                    <label>Equipment *</label>
                    <select id="maintEquipment" required></select>
                </div>
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="maintDescription" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="maintStatus">
                        <option>Pending</option>
                        <option>In Progress</option>
                        <option>Completed</option>
                        <option>Cancelled</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Save</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/maintenance.js"></script>
</body>
</html>
