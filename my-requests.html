<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Requests - Lab Asset Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div id="app" style="display:none;">
        <header class="app-header">
            <h1>📦 Laboratory Asset Management</h1>
            <div class="header-right">
                <span id="userInfo"></span>
                <span id="roleBadge" class="badge"></span>
                <button id="logoutBtn" class="btn btn-outline">Logout</button>
            </div>
        </header>
        <nav id="mainNav" class="main-nav"></nav>

        <main class="dashboard">
            <div class="page-header">
                <h1>📋 My Borrowing Requests</h1>
                <button id="newRequestBtn" class="btn btn-success">
                    <i class="fas fa-plus"></i> New Request
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Equipment</th>
                            <th>Requested</th>
                            <th>Expected Return</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="myReqBody"></tbody>
                </table>
            </div>
        </main>
    </div>

    <div id="loading" class="loading-spinner"><h2>Loading...</h2></div>

    <!-- NEW REQUEST MODAL -->
    <div id="requestModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close-btn" id="closeRequestModal">&times;</span>
            <h2>➕ New Borrowing Request</h2>
            <form id="requestForm">
                <div class="form-group">
                    <label>Equipment *</label>
                    <select id="reqEquipment" required></select>
                </div>
                <div class="form-group">
                    <label>Expected Return Date *</label>
                    <input type="date" id="reqReturnDate" required>
                </div>
                <div class="form-group">
                    <label>Purpose</label>
                    <textarea id="reqPurpose" rows="2" placeholder="Reason for borrowing..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit Request</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/my-requests.js"></script>
</body>
</html>
